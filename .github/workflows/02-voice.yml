# Stage 2 — Voice. Uses a provided voice file if the job folder has one;
# otherwise generates narration with Edge TTS (free, no key), Piper fallback.
name: "02 - Voice"

on:
  schedule:
    - cron: "30 2 * * *"     # 07:30 PKT daily, after clip search
  workflow_dispatch:

concurrency:
  group: steel-atlas-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      JOBSTORE_LIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (with ffprobe)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg && command -v ffprobe

      - name: Install dependencies (+ Piper fallback)
        run: |
          pip install -r requirements.txt
          pip install piper-tts || echo "piper install failed — Edge TTS is primary"

      - name: Run voice stage
        run: python -m pipeline.run_job --stage voice

      - name: Commit job state
        run: |
          git config user.name "steel-atlas-bot"
          git config user.email "steel-atlas-bot@users.noreply.github.com"
          git add -A jobs 2>/dev/null || true
          git add -A state 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "voice: job state update [skip ci]"
          git push || echo "push failed — next run retries"
