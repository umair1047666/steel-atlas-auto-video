# Stage 4 — Upload. Drive (user OAuth) then YouTube (videos.insert).
# SAFETY: this workflow ALWAYS runs a dry-run first. A real upload happens
# only when the workflow is dispatched with live=true AND the repository
# variable UPLOAD_LIVE is set to 1. The scheduled run is dry-run only.
# The YouTube step is deliberately separate: the user can disable it and
# hand the finished video to his existing Cloudflare video-scheduler instead.
name: "04 - Upload"

on:
  schedule:
    - cron: "30 3 * * *"     # 08:30 PKT daily, after render — dry-run only
  workflow_dispatch:
    inputs:
      live:
        description: "REAL upload (not a dry run). Only use after a dry run passed."
        required: false
        default: false
        type: boolean

concurrency:
  group: steel-atlas-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      DRIVE_MUSIC_FILE_ID: ${{ secrets.DRIVE_MUSIC_FILE_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
      JOBSTORE_LIVE: "1"
      # Live uploads need BOTH: the dispatch input AND this variable = 1.
      UPLOAD_LIVE: ${{ (inputs.live && vars.UPLOAD_LIVE == '1') && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Announce mode
        run: |
          if [ "$UPLOAD_LIVE" = "1" ]; then echo "MODE: LIVE upload"; else echo "MODE: DRY-RUN (no upload happens)"; fi

      - name: Run upload stage
        run: |
          if [ "$UPLOAD_LIVE" = "1" ]; then python -m pipeline.run_job --stage upload --live; else python -m pipeline.run_job --stage upload; fi

      - name: Commit job state
        run: |
          git config user.name "steel-atlas-bot"
          git config user.email "steel-atlas-bot@users.noreply.github.com"
          git add -A jobs 2>/dev/null || true
          git add -A state 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "upload: job state update [skip ci]"
          git push || echo "push failed — next run retries"
