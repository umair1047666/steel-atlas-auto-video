# Stage 3 — Render + auto-QC. Normalises clips, concats (copy, no re-encode),
# renders 1080p with ducked music + burned-in highlight subtitles, then runs
# the automatic quality gate. A QC failure STOPS the job — nothing uploads.
# The music track is fetched from Drive (secret DRIVE_MUSIC_FILE_ID) — music
# files are never committed to git. If the track is missing, the workflow
# fails loudly; it never renders silently without music.
name: "03 - Render and QC"

on:
  schedule:
    - cron: "0 3 * * *"      # 08:00 PKT daily, after voice
  workflow_dispatch:

concurrency:
  group: steel-atlas-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # 6h job cap; a 20-min 1080p render is ~30-75 min
    env:
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      DRIVE_MUSIC_FILE_ID: ${{ secrets.DRIVE_MUSIC_FILE_ID }}
      JOBSTORE_LIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (with ffprobe)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg && command -v ffprobe

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run render + QC
        run: python -m pipeline.run_job --stage render

      - name: Commit job state
        run: |
          git config user.name "steel-atlas-bot"
          git config user.email "steel-atlas-bot@users.noreply.github.com"
          git add -A jobs 2>/dev/null || true
          git add -A state 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "render-qc: job state update [skip ci]"
          git push || echo "push failed — next run retries"
