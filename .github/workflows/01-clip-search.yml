# Stage 1 — Clip search. Claims the oldest queued job, searches stock footage
# per scene (relevance-gated, Full HD only), downloads clips, falls back to
# photo / AI still / title card. Commits the job state back to the repo so
# stage 2 can pick it up.
# Runs serially with the other stages (one concurrency group) so two jobs
# never race on the same queue.
name: "01 - Clip Search"

on:
  schedule:
    - cron: "0 2 * * *"      # 07:00 PKT daily (tune in config)
  workflow_dispatch:

concurrency:
  group: steel-atlas-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip-search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      # Job-store sync between stages (media lives on Drive, not on the runner).
      JOBSTORE_LIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (with ffprobe)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg && command -v ffprobe

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run clip search
        run: python -m pipeline.run_job --stage clip-search

      - name: Commit job state
        run: |
          git config user.name "steel-atlas-bot"
          git config user.email "steel-atlas-bot@users.noreply.github.com"
          git add -A jobs queue 2>/dev/null || true
          git add -A state 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "clip-search: job state update [skip ci]"
          git push || echo "push failed (nothing new or transient) — next run retries"
